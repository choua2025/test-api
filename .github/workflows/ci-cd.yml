name: CI/CD

on:
  push:
    branches:
      - main
      - development
      - test

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    needs: ci
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      APP_DIR: C:\inetpub\wwwroot\test-api
      PM2_APP: test-api

    defaults:
      run:
        shell: powershell

    steps:
      - name: Show deploy target
        run: |
          Write-Host "========== START DEPLOY =========="
          Write-Host "App directory: $env:APP_DIR"
          Write-Host "Commit:        $env:GITHUB_SHA"
          Write-Host "Runner:        $env:RUNNER_NAME"

      - name: Fetch latest code
        run: |
          Set-Location $env:APP_DIR
          Write-Host "Current directory: $(Get-Location)"

          git fetch --all --prune
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }

          git checkout main
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }

          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

          git log -1 --oneline

      - name: Install dependencies
        run: |
          Set-Location $env:APP_DIR
          npm ci --omit=dev
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

      - name: Build project
        run: |
          Set-Location $env:APP_DIR
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }

      - name: Restart PM2
        run: |
          Set-Location $env:APP_DIR

          pm2 reload $env:PM2_APP
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Reload failed, starting app fresh..."
            pm2 start src/index.js --name $env:PM2_APP
            if ($LASTEXITCODE -ne 0) { throw "pm2 start failed" }
          }

          pm2 save
          pm2 list

      - name: Done
        run: |
          Write-Host "Deployment completed successfully."
          Write-Host "========== END DEPLOY =========="
