name: CI/CD

on:
  push:
    branches:
      - main
      - development
      - test

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            $ErrorActionPreference = "Stop"

            $AppDir = "C:\inetpub\wwwroot\test-api"
            $Pm2App = "test-api"

            Write-Host "========== START DEPLOY =========="
            Set-Location $AppDir
            Write-Host "Current directory: $(Get-Location)"

            Write-Host "Fetching latest code..."
            git fetch --all --prune
            if ($LASTEXITCODE -ne 0) { Write-Host "git fetch failed"; exit 1 }

            Write-Host "Checkout main..."
            git checkout main
            if ($LASTEXITCODE -ne 0) { Write-Host "git checkout failed"; exit 1 }

            Write-Host "Reset to origin/main..."
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { Write-Host "git reset failed"; exit 1 }
            git log -1 --oneline

            Write-Host "Install dependencies..."
            npm ci --omit=dev
            if ($LASTEXITCODE -ne 0) { Write-Host "npm ci failed"; exit 1 }

            Write-Host "Build project..."
            npm run build
            if ($LASTEXITCODE -ne 0) { Write-Host "npm run build failed"; exit 1 }

            Write-Host "Restart PM2..."
            pm2 reload $Pm2App
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Reload failed, starting app fresh..."
              pm2 start src/index.js --name $Pm2App
              if ($LASTEXITCODE -ne 0) { Write-Host "pm2 start failed"; exit 1 }
            }

            Write-Host "Save PM2..."
            pm2 save
            pm2 list

            Write-Host "Deployment completed successfully."
            Write-Host "========== END DEPLOY =========="
