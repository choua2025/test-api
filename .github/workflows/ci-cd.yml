name: CI/CD

on:
  push:
    branches:
      - main
      - development
      - test

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_NAME: ${{ secrets.SERVER_NAME }}
      SSH_PORT: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          echo "========== START DEPLOY =========="
          echo "Target: $SERVER_NAME@$SERVER_HOST:$SSH_PORT"
          echo "Commit: $GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              "$SERVER_NAME@$SERVER_HOST" \
              "powershell -NoProfile -ExecutionPolicy Bypass -Command -" < cd/deploy.ps1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key