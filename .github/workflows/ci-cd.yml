name: CI/CD

on:
  push:
    branches:
      - main
      - development
      - test

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows Server
    runs-on: [self-hosted, windows]
    needs: ci
    if: github.ref == 'refs/heads/main'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      APP_DIR: C:\inetpub\wwwroot\test-api
      PM2_APP: test-api

    defaults:
      run:
        shell: powershell

    steps:
      - name: Show deploy target
        run: |
          Write-Host "========== START DEPLOY =========="
          Write-Host "App directory: $env:APP_DIR"
          Write-Host "Commit:        $env:GITHUB_SHA"

      - name: Trust repository directory
        run: |
          $repo = $env:APP_DIR -replace '\\','/'
          $trusted = @(git config --global --get-all safe.directory)
          if ($trusted -notcontains $repo) {
            git config --global --add safe.directory $repo
            if ($LASTEXITCODE -ne 0) { throw "failed to add safe.directory" }
            Write-Host "Added safe.directory: $repo"
          } else {
            Write-Host "Already trusted: $repo"
          }
          exit 0

      - name: Fetch latest code
        run: |
          Set-Location $env:APP_DIR
          git fetch --all --prune
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout main
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          git log -1 --oneline

      - name: Install dependencies
        run: |
          Set-Location $env:APP_DIR
          # --include=dev so pm2/build tools install even if NODE_ENV=production
          npm ci --include=dev
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

      - name: Build project
        run: |
          Set-Location $env:APP_DIR
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }

      - name: Restart PM2 (test-api only)
        run: |
          Set-Location $env:APP_DIR

          # Use the pm2 installed by 'npm ci' rather than whatever is on PATH,
          # which varies with the account the runner service logs on as.
          $pm2 = Join-Path $env:APP_DIR 'node_modules\.bin\pm2.cmd'
          if (-not (Test-Path $pm2)) { throw "pm2 not found at $pm2 - did 'npm ci' run?" }

          # Reload ONLY test-api. Other pm2 apps on this server are never touched.
          & $pm2 reload $env:PM2_APP
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Reload failed (app may not exist yet), starting fresh..."
            & $pm2 start src/index.js --name $env:PM2_APP
            if ($LASTEXITCODE -ne 0) { throw "pm2 start failed" }
          }

          # Show only test-api status (does not affect other apps)
          & $pm2 describe $env:PM2_APP

      - name: Done
        run: |
          Write-Host "Deployment completed successfully."
          Write-Host "========== END DEPLOY =========="