name: API CI/CD

on:
  push:
    branches: [developer, test]
  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Project
        run: npm run build

  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "========== START DEPLOY =========="

            cd /var/www/test-api/test-api

            echo "Current directory:"
            pwd

            echo "Fetching latest code..."
            git fetch --all

            echo "Checkout main..."
            git checkout main

            echo "Pull latest code..."
            git pull origin main

            echo "Install dependencies..."
            npm ci

            echo "Build project..."
            npm run build

            echo "Restart PM2..."
            pm2 reload test-api || pm2 restart test-api

            echo "Save PM2..."
            pm2 save

            echo "Deployment completed successfully."

            echo "========== END DEPLOY =========="
